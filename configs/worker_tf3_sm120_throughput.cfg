# Saturated TF3 worker, measured at capacity 64 and physical batch 16.
# Two NN service threads and direct CUDA launches. Use the one-thread profile
# for low concurrency; this profile can be slower when its batches are starved.
rules = chinese
komi = 7.5
nnBackend = cudabackend
nnMaxBatchSize = 16
numNNServerThreadsPerModel = 2
nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 14
cudaTacticPlan = plans/worker-tf3-sm120-throughput.json
