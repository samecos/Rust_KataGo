# RustGo pure NN worker for Go Server. Search runs on the server.
# katago-rs nnworker --server 127.0.0.1:50051 --worker-id rustgo-5070ti
#   --model D:/Go/Server/models/kata1-tf3-b11c768-s11001M-d5973M.bin.gz
#   --config configs/worker_cuda.cfg --capacity 32
rules = chinese
komi = 7.5
nnBackend = cudabackend
nnMaxBatchSize = 16
nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 14
# Native TF3 model shared with the C++ workers. Use the default CUDA tactics.
# The existing best-tactic-plan.json is bound to b11fix.onnx and MUST NOT be
# reused here: the source model SHA256 is part of its certification identity.
