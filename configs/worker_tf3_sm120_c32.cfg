# Saturated C32 TF3 Worker: one NN service thread, physical batch 16.
# Revalidated with corrected FP16 encoding: +2.08% versus the standard
# single-thread profile on 2026-09-08 (8192-request ABBA, sustained C32).
# This profile targets sustained 32 outstanding requests. For lighter traffic
# use worker_tf3_sm120.cfg; for sustained C64 use the throughput profile.
rules = chinese
komi = 7.5
nnBackend = cudabackend
nnMaxBatchSize = 16
numNNServerThreadsPerModel = 1
nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 14
cudaTacticPlan = plans/worker-tf3-sm120-c32.json
