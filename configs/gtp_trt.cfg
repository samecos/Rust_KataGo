# Rust_KataGo 真实推理配置（TRT 后端 + b11fix.onnx）
# 用法：./target/debug/katago-rs gtp --config configs/gtp_trt.cfg --model D:/code/b11fix.onnx
# 说明：nnBackend=trtbackend 时 TRT 强制 NCHW；首次启动会构建引擎并缓存
# 为 b11fix.onnx.trtplan.b<batch>.<精度>（后续启动秒开）。

rules = chinese
komi = 7.5
nnBackend = trtbackend
nnMaxBatchSize = 8
numSearchThreads = 8
nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 14
maxVisits = 1000
ponderingEnabled = false
