# Native TF3 v17 B11/B15, including model-declared 8-aligned pruned FFN widths.
# Experimental lossy W8A8 backend. No FP16 certification plan applies here.
nnBackend = cudaint8backend
cudaInt8Scope = ffn
rules = chinese
komi = 7.5
numSearchThreads = 8
nnMaxBatchSize = 8
numNNServerThreadsPerModel = 1
nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 14
maxVisits = 800
allowResignation = false
resignThreshold = -0.99
resignConsecTurns = 3
