rules = chinese
komi = 7.5
nnBackend = cudabackend
# 2026-08-15 实测调优(见 docs/cuda-optimization-plan.md "B16 高并发复测"):
# batch 上限 16 是吞吐最优点(B8→B16 每行成本 -46%,B16 之后转劣);
# 16 线程 ~692 nnEvals/s(cap8/8线程 ~600);24-32 线程略升至 ~765 但
# CPU 竞争加剧,16 是甜点。
nnMaxBatchSize = 16
numSearchThreads = 16
nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 14
maxVisits = 1000
ponderingEnabled = false
