# Rust_KataGo 生产配置：CUDA 后端（5070 Ti 优化，2026-08-19 schema-2 认证）
# 用法：katago-rs.exe gtp --config configs/gtp_cuda.cfg --model D:/code/b11fix.onnx

rules = chinese
komi = 7.5

# ---- 搜索 ----
# 对局/分析推荐 12-16（visits/s 峰值档）；纯吞吐场景（自对弈批量）可到 48
numSearchThreads = 12
# 流式分析（lz-analyze/kata-analyze 带 interval）下搜索持续运行直到 stop，
# maxVisits 不再是分析的必要条件；genmove 仍可用它限制每手计算量。
# 想限制 genmove 用时可用 GTP time_settings 或注释掉本行走时限。
maxVisits = 800

# ---- NN 后端（优化核心，勿改）----
nnBackend = cudabackend
cudaTacticPlan = D:/code/Rust_KataGo/plans/best-tactic-plan.json
# batch 上限 16：实测 B16 之后每行成本转劣（2026-08-15 ABBA）
nnMaxBatchSize = 16
nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 14
# CUDA graph warmup is enabled by default; set true only for cold-start diagnostics.
# cudaDisableWarmup = true

# ---- 对人类友好（比赛/对照测试请注释掉）----
lagBuffer = 1.0
searchFactorAfterOnePass = 0.50
searchFactorAfterTwoPass = 0.25
searchFactorWhenWinning = 0.40
searchFactorWhenWinningThreshold = 0.95
