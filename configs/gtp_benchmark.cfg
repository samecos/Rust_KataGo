# Rust_KataGo 性能基准配置（配合 benchmark 命令使用）
#
# 用法（CUDA 后端）：
#   ./target/release/katago-rs.exe benchmark \
#     --config configs/gtp_benchmark.cfg \
#     --model D:/code/b11fix.onnx \
#     -v 20 -n 1 -t 1,4,8
#
# 说明：
#   - visits 与线程由 benchmark 命令的 -v/-t 参数控制（本文件值为默认兜底）
#   - 若需对照 TRT：--override-config nnBackend=trtbackend（需 --features trt 编译）
#   - 不带 -t 会走 auto-tune，每个线程配置都重新加载模型（很慢），务必用 -t

rules = chinese
komi = 7.5
nnBackend = cudabackend
nnMaxBatchSize = 8
numSearchThreads = 8
nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 14
maxVisits = 200
ponderingEnabled = false
