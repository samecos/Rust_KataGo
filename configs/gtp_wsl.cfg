# Rust_KataGo production configuration for WSL.
# Launch with:
# /root/rk-target/release/katago-rs gtp \
#   --config /mnt/d/code/Rust_KataGo/configs/gtp_wsl.cfg \
#   --model /mnt/d/code/b11fix.onnx

rules = chinese
komi = 7.5

# Best interactive Lizzie/GTP setting measured on RTX 5070 Ti.
numSearchThreads = 16

# Keep one NN server and CUDA graphs enabled in search workloads.
nnBackend = cudabackend
cudaTacticPlan = /mnt/d/code/Rust_KataGo/plans/best-tactic-plan.json
nnMaxBatchSize = 16
nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 14
maxVisits = 800
ponderingEnabled = false

lagBuffer = 1.0
searchFactorAfterOnePass = 0.50
searchFactorAfterTwoPass = 0.25
searchFactorWhenWinning = 0.40
searchFactorWhenWinningThreshold = 0.95
