[package]
name = "katago"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "katago-rs"
path = "src/main.rs"

[dependencies]
kata_core = { path = "../kata_core" }
kata_game = { path = "../kata_game" }
kata_data = { path = "../kata_data" }
kata_nn = { path = "../kata_nn" }
kata_search = { path = "../kata_search" }
kata_program = { path = "../kata_program" }
kata_book = { path = "../kata_book" }
kata_distributed = { path = "../kata_distributed" }
kata_worker = { path = "../kata_worker" }
tokio = { version = "1", features = ["rt-multi-thread", "signal", "sync"] }
clap = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
cudarc = { version = "0.19", optional = true, features = ["cuda-version-from-build-system"] }

[features]
# Enables the TensorRT backend (requires local CUDA + TensorRT SDK at build time).
trt = ["kata_nn/trt"]
# Enables the hand-written CUDA backend (`cudabackend` nnBackend value;
# kernels are compiled to PTX by nvcc at build time).
cuda = ["kata_nn/cuda", "kata_program/cuda", "kata_worker/cuda", "dep:cudarc"]

[dev-dependencies]
tempfile = "3"
