[package]
name = "kata_nn"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Enables the TensorRT backend module. Real inference still requires the
# NVIDIA TensorRT native libraries to be available at build/link time.
trt = []
# Enables the hand-written CUDA backend (kernels compiled by nvcc at build
# time according to configs/sm-targets.json; requires a CUDA toolkit).
cuda = ["dep:cudarc"]

[dependencies]
flate2 = { workspace = true }
kata_core = { path = "../kata_core" }
kata_game = { path = "../kata_game" }
ndarray = { workspace = true }
parking_lot = { workspace = true }
prost = "0.13"
serde = { workspace = true }
thiserror = { workspace = true }
cudarc = { version = "0.19", optional = true, features = ["cuda-version-from-build-system", "nvrtc", "cublaslt"] }

[build-dependencies]
cc = "1"
prost-build = "0.13"
protoc-bin-vendored = "3"
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
kata_data = { path = "../kata_data" }
