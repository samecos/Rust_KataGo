[package]
name = "original-worker-probe"
version = "0.1.0"
edition = "2024"
publish = false

# Deliberately separate from both the engine and Server workspaces.
[workspace]
resolver = "2"

[dependencies]
go-core = { path = "D:/Go/Server/crates/go-core" }
go-protocol = { path = "D:/Go/Server/crates/go-protocol" }
go-server = { path = "D:/Go/Server/crates/go-server" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
